name: Submit Zearches Listing

on:
  push:
    branches:
      - main
    paths:
      - 'campaigns/requests/zearches-*.json'
  workflow_dispatch:
    inputs:
      request_file:
        description: 'Path to an approved Zearches request JSON'
        required: true
        default: 'campaigns/requests/zearches-dearpassengerscrew.json'

env:
  PYTHONUNBUFFERED: '1'

jobs:
  submit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve approved request files
        id: requests
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            file='${{ inputs.request_file }}'
            if [[ ! -f "$file" ]]; then
              echo "Request file not found: $file" >&2
              exit 2
            fi
            printf 'files<<EOF\n%s\nEOF\n' "$file" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          before='${{ github.event.before }}'
          after='${{ github.sha }}'
          files="$(git diff --name-only "$before" "$after" -- 'campaigns/requests/zearches-*.json' || true)"
          if [[ -z "$files" ]]; then
            echo 'No new/changed approved request files found.' >&2
            exit 2
          fi
          printf 'files<<EOF\n%s\nEOF\n' "$files" >> "$GITHUB_OUTPUT"

      - name: Submit each newly approved request once
        shell: bash
        env:
          REQUEST_FILES: ${{ steps.requests.outputs.files }}
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            echo "==> $file"
            python3 scripts/submit_zearches_index.py "$file"
          done <<< "$REQUEST_FILES"
